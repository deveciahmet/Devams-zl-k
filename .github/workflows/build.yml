name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Derle
        run: ./gradlew assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk Devamsizlik.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Devamsizlik-apk
          path: Devamsizlik.apk
      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Devamsızlık (son sürüm)
          prerelease: false
          make_latest: true
          files: Devamsizlik.apk
